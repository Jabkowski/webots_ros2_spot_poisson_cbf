pinn_safety:
  ros__parameters:
    # Local clone of https://github.com/Jabkowski/Poisson-Safety-Boundary-Determiner
    # (branch "pinn", commit 993cc12), see README section "RrtCbf planner".
    # "~" is expanded; change it if you cloned elsewhere.
    pinn_root: ~/Poisson-Safety-Boundary-Determiner
    # Paths below are relative to pinn_root.
    weights_path: results/release_weights/pde_0_5_poisson_unet_bilinear_model_512x512_2000_e35_normalization_bc_fix_test_best.pth
    norm_stats_path: results/release_weights/pde_0_5_poisson_unet_bilinear_model_512x512_2000_e35_normalization_bc_fix_test_norm_stats.pt
    dilate_map: 5
    # Publish raw h + metric gradients on /pinn_safety/field (latched) for planners.
    publish_field: true
    # Run inference exactly once after the first /map; manual re-run via /pinn_safety/run.
    auto_run_once: true
